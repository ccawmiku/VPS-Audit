[package]
name = "vless-audit"
version = "0.1.0"
edition = "2024"
description = "Lightweight passive AF_PACKET traffic & domain auditor for single-host VLESS VPS"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
psl = "2.1"
rusqlite = { version = "0.43", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
