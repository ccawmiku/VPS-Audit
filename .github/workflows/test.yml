name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust unit tests
        run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run blocklist script tests
        run: python3 -m unittest discover -s deploy/tests -v

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard script syntax
        run: node --check src/web/static/dashboard.js
      - name: Validate embedded world map JSON
        run: python3 -c "import json; json.load(open('src/web/static/world-map.json'))"
